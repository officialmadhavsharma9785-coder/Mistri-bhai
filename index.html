<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServeLocal</title><link rel="stylesheet" href="../shared/ui.css"></head><body>
<div class="wrap" id="app"></div><nav class="tabs" id="tabs"></nav><div class="toast" id="toast"></div>
<script src="../shared/store.js"></script>
<script>
let me = JSON.parse(sessionStorage.getItem('sl_user') || 'null'), tab = 'home', sel = null, q = '';
const V = id => document.getElementById(id)?.value;
const go = (t, s) => { tab = t; sel = s || null; render(); };
async function run(fn) { try { await fn(); } catch (e) { toast(e.message); } render(); }
const TABS = [['home', 'Home'], ['bookings', 'Bookings'], ['work', 'Work With Us'], ['me', 'Account']];

async function render() {
  const d = await Api.snapshot(), app = document.getElementById('app'), tabs = document.getElementById('tabs');
  if (me) { me = d.users.find(u => u.id === me.id); if (!me || me.status === 'BLOCKED') { me = null; sessionStorage.clear(); } }
  if (!me) { tabs.innerHTML = ''; app.innerHTML = loginView(); return; }
  tabs.innerHTML = TABS.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
  app.innerHTML = { home: homeView, book: bookView, bookings: bookingsView, work: workView, me: meView }[tab](d);
}

const loginView = () => `<h1>ServeLocal</h1><p class="note">Book trusted electricians, plumbers and more near you. Demo mode: use OTP ${MOCK_OTP}. No SMS is sent.</p>
<label>Your name</label><input id="ln"><label>Mobile number</label><input id="lm" inputmode="numeric" maxlength="10"><label>OTP</label><input id="lo" inputmode="numeric" maxlength="6">
<button class="btn" onclick="run(async()=>{me=await Api.login('customer',V('lm'),V('lo'),V('ln'));sessionStorage.setItem('sl_user',JSON.stringify(me))})">Log in</button>`;

function homeView(d) {
  const cat = c => d.categories.find(x => x.id === c.categoryId)?.name || '';
  const list = d.services.filter(s => s.available && (s.name + ' ' + cat(s)).toLowerCase().includes(q.toLowerCase()));
  return `<h1>What do you need done?</h1><input id="sq" placeholder="Search services" value="${esc(q)}" onchange="q=this.value;render()">
<div class="grid">${d.categories.map(c => `<button class="cat" onclick="q='${esc(c.name)}';render()"><span>${c.icon}</span>${esc(c.name)}</button>`).join('')}</div>
${q ? `<button class="btn sec sm" onclick="q='';render()">Clear filter</button>` : ''}<h2>Services</h2>
${list.map(s => { const n = d.workers.filter(w => w.status === 'ACTIVE' && w.online && w.categoryId === s.categoryId).length;
  return `<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="price">${inr(s.price)}</span></div><p class="note">${esc(s.description)}</p>
<div class="row"><span class="note">${n} provider${n === 1 ? '' : 's'} online</span><button class="btn sm" onclick="go('book','${s.id}')">Book</button></div></div>`; }).join('') || '<p class="note">No services found. Try another search.</p>'}
<div class="card"><b>Want to earn with your skills?</b><p class="note">Apply to become a service provider.</p><button class="btn sec" onclick="go('work')">Become a Service Provider</button></div>`;
}

function bookView(d) {
  const s = d.services.find(x => x.id === sel);
  return `<button class="btn sec sm" onclick="go('home')">Back</button><h1>${esc(s.name)}</h1><div class="card"><p>${esc(s.description)}</p><div class="price">${inr(s.price)}</div><p class="note">Price is fixed. Any extra work needs your approval before it is added.</p></div>
<label>Address</label><textarea id="ba" rows="2"></textarea><label>City</label><input id="bc" value="Agra"><label>Date and time</label><input id="bt" type="datetime-local"><label>Coupon (optional)</label><input id="bo">
<p class="note">Map pin selection: not connected yet (placeholder).</p>
<button class="btn" onclick="run(async()=>{await Api.createBooking({userId:me.id,serviceId:'${s.id}',address:V('ba'),city:V('bc'),slot:V('bt'),coupon:V('bo')});tab='bookings';toast('Booking requested')})">Request booking</button>`;
}

function bookingsView(d) {
  const list = d.bookings.filter(b => b.userId === me.id).reverse();
  return `<h1>Your bookings</h1>` + (list.map(b => {
    const s = d.services.find(x => x.id === b.serviceId), w = d.workers.find(x => x.id === b.workerId), ex = extrasOf(d, b.id), pend = ex.find(e => e.status === 'PENDING');
    return `<div class="card"><div class="row"><b>${esc(s.name)}</b>${tag(b.status)}</div><p class="note">${dt(b.slot)} · ${esc(b.address)}<br>${w ? 'Provider: ' + esc(w.name) : 'Finding a provider'}</p>
<div class="row"><span>Total</span><span class="price">${inr(totalOf(d, b))}</span></div>${b.discount ? `<p class="note">Coupon ${esc(b.offerCode)}: -${inr(b.discount)}</p>` : ''}
${ex.map(e => `<p class="note">Extra ${inr(e.amount)}: ${esc(e.reason)} (${e.status})</p>`).join('')}
${pend ? `<button class="btn sm" onclick="run(()=>Api.respondExtra('${pend.id}',true))">Approve ${inr(pend.amount)}</button><button class="btn bad sm" onclick="run(()=>Api.respondExtra('${pend.id}',false))">Reject</button>` : ''}
${['SEARCHING', 'ASSIGNED', 'ACCEPTED', 'ARRIVING'].includes(b.status) ? `<button class="btn bad sm" onclick="run(()=>Api.cancelBooking('${b.id}'))">Cancel booking</button>` : ''}
${b.status === 'PAYMENT_PENDING' ? `<button class="btn" onclick="run(()=>Api.pay('${b.id}'))">Pay ${inr(totalOf(d, b))} (demo, no real payment)</button>` : ''}
${b.status === 'PAYMENT_SETTLED' ? `<label>Rate your provider</label><select id="rs${b.id}"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><input id="rt${b.id}" placeholder="Write a review"><button class="btn sm" onclick="run(()=>Api.rate('${b.id}',V('rs${b.id}'),V('rt${b.id}')))">Submit review</button>` : ''}
<details><summary>Status history</summary>${b.history.map(h => `<div class="note">${h.status} · ${dt(h.at)}</div>`).join('')}</details></div>`;
  }).join('') || '<p class="note">No bookings yet. Pick a service on Home.</p>');
}

function workView(d) {
  const a = d.workerApplications.filter(x => x.userId === me.id).pop();
  if (a && a.status !== 'REJECTED') return `<h1>Your application</h1><div class="card"><div class="row"><b>${esc(a.name)}</b>${tag(a.status)}</div>
<p class="note">Steps: PENDING, UNDER REVIEW, then APPROVED or REJECTED.</p>${a.history.map(h => `<div class="note">${h.status} · ${dt(h.at)}</div>`).join('')}
${a.status === 'APPROVED' ? `<p>You are approved. Open the separate Worker App (worker-app/index.html) and log in with ${esc(a.mobile)}.</p>` : '<p class="note">We will notify you here after admin review.</p>'}</div>`;
  const cats = d.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  return `<h1>Work with us</h1>${a ? `<div class="card">${tag('REJECTED')} <p class="note">${esc(a.note || 'Application was not approved.')} You can apply again.</p></div>` : ''}
<p class="note">Fill this form to apply. Files below are not uploaded in demo mode (file names only).</p>
<label>Full name</label><input id="wn" value="${esc(me.name)}"><label>Mobile number</label><input id="wm" value="${esc(me.mobile)}" maxlength="10">
<label>Profile photo</label><input id="wp" type="file" accept="image/*"><label>Address</label><textarea id="wa" rows="2"></textarea><label>City</label><input id="wc" value="Agra">
<label>Service category</label><select id="wk">${cats}</select><label>Skills</label><input id="ws" placeholder="e.g. wiring, fan repair"><label>Experience (years)</label><input id="we" type="number" min="0">
<label>Services offered</label><input id="wo" placeholder="e.g. fan repair, switch fitting"><label>Working radius (km)</label><input id="wr" type="number" min="1" value="10">
<label>Availability</label><select id="wv"><option>Full time</option><option>Part time</option><option>Weekends only</option></select>
<div class="grid"><div><label>From</label><input id="wf" type="time" value="09:00"></div><div><label>To</label><input id="wt" type="time" value="18:00"></div></div>
<label>ID type</label><select id="wi"><option>Aadhaar</option><option>PAN</option><option>Voter ID</option><option>Driving licence</option></select><label>ID number (only last 4 digits are kept)</label><input id="wj">
<label>ID document</label><input id="wd" type="file"><label>Address proof</label><input id="wx" type="file">
<label>Payout method</label><select id="wy"><option>UPI</option><option>Bank account</option></select><label>UPI ID or account number and IFSC</label><input id="wz">
<label><input id="wu" type="checkbox"> I confirm the details are true and I agree to platform verification.</label>
<button class="btn" onclick="run(async()=>{const fl=i=>document.getElementById(i).files[0]?.name||'';await Api.applyWorker(me,{name:V('wn'),mobile:V('wm'),photo:fl('wp'),address:V('wa'),city:V('wc'),categoryId:V('wk'),skills:V('ws'),experience:V('we'),services:V('wo'),radiusKm:V('wr'),availability:V('wv'),from:V('wf'),to:V('wt'),idType:V('wi'),idNumber:V('wj'),idFile:fl('wd'),addrFile:fl('wx'),payoutMethod:V('wy'),payoutDetail:V('wz'),consent:document.getElementById('wu').checked});toast('Application submitted')})">Submit application</button>`;
}

function meView(d) {
  const ns = d.notifications.filter(n => (n.toType === 'USER' && (n.toId === me.id || n.toId === 'ALL'))).reverse(), bs = d.bookings.filter(b => b.userId === me.id);
  return `<h1>Account</h1><div class="card"><label>Name</label><input id="pn" value="${esc(me.name)}"><div class="note">Mobile ${esc(me.mobile)}</div><button class="btn sm" onclick="run(()=>Api.updateUser(me.id,{name:V('pn')}))">Save name</button></div>
<h2>Offers</h2>${d.offers.filter(o => o.active).map(o => `<div class="card"><b>${esc(o.code)}</b> ${o.type === 'FLAT' ? inr(o.value) + ' off' : o.value + '% off'}<div class="note">Valid till ${esc(o.validTill)}</div></div>`).join('') || '<p class="note">No offers right now.</p>'}
<h2>Notifications</h2>${ns.map(n => `<div class="card">${esc(n.text)}<div class="note">${dt(n.createdAt)}</div></div>`).join('') || '<p class="note">Nothing new.</p>'}
<h2>Help and support</h2><div class="card"><label>Booking</label><select id="hb"><option value="">Not about a booking</option>${bs.map(b => `<option value="${b.id}">${esc(d.services.find(s => s.id === b.serviceId).name)} · ${dt(b.slot)}</option>`).join('')}</select>
<label>Type</label><select id="hk"><option value="COMPLAINT">Complaint</option><option value="REPORT_WORKER">Report provider</option><option value="DISPUTE">Raise dispute</option><option value="SUPPORT">Other help</option></select><textarea id="ht" rows="3" placeholder="Tell us what happened"></textarea>
<button class="btn" onclick="run(async()=>{await Api.raiseTicket({fromType:'USER',fromId:me.id,bookingId:V('hb'),kind:V('hk'),text:V('ht')});toast('Sent to support')})">Send</button></div>
<button class="btn sec" onclick="me=null;sessionStorage.clear();render()">Log out</button>`;
}
render();
</script></body></html>
