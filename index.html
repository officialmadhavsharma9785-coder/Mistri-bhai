<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISTRI BHAI — Local Services</title><style>
:root{
  --bg:#07111f;--bg2:#0d1a2c;--text:#f7fbff;--muted:#9eafc4;--line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.11);--accent:#8ec5ff;
  --accent2:#b8a6ff;--success:#62e6ad;--warn:#ffd479;--danger:#ff7f96;
  --shadow:0 24px 80px rgba(0,0,0,.32);--radius:24px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:
radial-gradient(900px 500px at 10% -10%,rgba(103,164,255,.22),transparent 60%),
radial-gradient(700px 450px at 100% 0%,rgba(173,125,255,.18),transparent 58%),
linear-gradient(145deg,var(--bg),#0a1321 55%,#07101c);color:var(--text);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.035),transparent 35%,rgba(255,255,255,.02));mix-blend-mode:screen}
button,input,select,textarea{font:inherit}button{cursor:pointer}
a{color:inherit;text-decoration:none}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(6,15,27,.68);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.nav{max-width:1400px;margin:auto;display:flex;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#dff1ff,#8bbcff 45%,#9b7cff);display:grid;place-items:center;color:#08111e;font-weight:900;box-shadow:0 10px 35px rgba(115,166,255,.25)}
.navlinks{display:flex;gap:6px;margin-left:auto;align-items:center}.navlinks button,.iconbtn{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 12px;border-radius:13px}.navlinks button:hover,.navlinks button.active,.iconbtn:hover{background:var(--glass);color:var(--text);border-color:var(--line)}
.menu{display:none}.shell{max-width:1400px;margin:auto;padding:30px 18px 90px}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:22px;align-items:stretch}.heroCard,.glass{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.045));box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:var(--radius)}
.heroCard{padding:38px;position:relative;overflow:hidden}.heroCard:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-100px;top:-110px;background:rgba(150,190,255,.16);filter:blur(8px)}
.eyebrow{display:inline-flex;gap:8px;align-items:center;color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px}.dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 15px var(--success)}
h1{font-size:clamp(36px,6vw,68px);line-height:.98;letter-spacing:-3px;margin:17px 0}.hero p{font-size:17px;color:var(--muted);line-height:1.65;max-width:720px}.heroActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid var(--line);border-radius:14px;padding:12px 17px;color:var(--text);background:var(--glass);transition:.2s;box-shadow:0 8px 25px rgba(0,0,0,.12)}.btn:hover{transform:translateY(-1px);background:var(--glass2)}.btn.primary{background:linear-gradient(135deg,#d9edff,#9bbfff);color:#07111f;border:0;font-weight:800}.btn.success{background:rgba(98,230,173,.13);border-color:rgba(98,230,173,.3);color:#a9f6d1}.btn.danger{background:rgba(255,127,150,.11);border-color:rgba(255,127,150,.3);color:#ffb5c2}.btn.small{padding:8px 11px;font-size:13px}
.heroStats{padding:25px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.13)}.stat strong{font-size:26px;display:block}.stat span{color:var(--muted);font-size:12px}
.section{margin-top:30px}.sectionHead{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:14px}.sectionHead h2{margin:0;font-size:25px;letter-spacing:-1px}.sectionHead p{margin:5px 0 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{padding:19px;border:1px solid var(--line);border-radius:20px;background:var(--glass);box-shadow:0 15px 50px rgba(0,0,0,.16);transition:.2s}.card:hover{transform:translateY(-2px);background:var(--glass2)}
.icon{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.04));border:1px solid var(--line);display:grid;place-items:center;font-size:23px;margin-bottom:14px}.card h3{margin:0 0 7px;font-size:17px}.muted{color:var(--muted)}.price{font-weight:800;font-size:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:12px;color:var(--muted)}.chip.success{color:#a9f6d1;border-color:rgba(98,230,173,.25)}.chip.warn{color:#ffe0a1;border-color:rgba(255,212,121,.25)}.chip.danger{color:#ffb5c2;border-color:rgba(255,127,150,.25)}
.search{display:flex;gap:8px;margin-top:18px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:rgba(2,9,17,.28);color:var(--text);border-radius:14px;padding:12px 14px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:rgba(142,197,255,.55);box-shadow:0 0 0 4px rgba(142,197,255,.08)}.textarea{min-height:100px;resize:vertical}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px}.field.full{grid-column:1/-1}
.panel{padding:24px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--glass);color:var(--muted);padding:9px 13px;border-radius:12px}.tab.active{color:var(--text);background:var(--glass2);border-color:rgba(142,197,255,.35)}
.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:600}.empty{padding:35px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(1,7,13,.62);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalBox{width:min(720px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,rgba(21,35,55,.97),rgba(9,19,32,.97));border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.5);padding:25px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalHead h2{margin:0}.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:rgba(14,28,45,.92);border:1px solid var(--line);padding:13px 16px;border-radius:14px;box-shadow:var(--shadow);transform:translateY(30px);opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:none;opacity:1}
.sideLayout{display:grid;grid-template-columns:245px 1fr;gap:18px}.sidebar{position:sticky;top:84px;height:calc(100vh - 110px);padding:15px}.sidebtn{width:100%;display:flex;gap:10px;align-items:center;border:1px solid transparent;background:transparent;color:var(--muted);padding:11px;border-radius:12px;margin-bottom:4px;text-align:left}.sidebtn:hover,.sidebtn.active{background:var(--glass);color:var(--text);border-color:var(--line)}.sideGroup{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#70839a;padding:13px 10px 7px}.mobileNav{display:none}
.metricGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.metric{padding:18px}.metric strong{font-size:28px}.metric small{display:block;color:var(--muted);margin-top:5px}.trend{font-size:12px;color:var(--success);margin-top:9px}
.list{display:grid;gap:9px}.listItem{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.045)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authBox{width:min(470px,100%);padding:30px}.authBrand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.auth h1{font-size:38px;letter-spacing:-2px;margin:0 0 8px}.auth p{color:var(--muted);line-height:1.5}.authActions{display:grid;gap:9px;margin-top:17px}.linkbtn{border:0;background:none;color:var(--accent);padding:5px;cursor:pointer}.statusLine{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}
.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#c8e6ff,#9e8cff);color:#08111f;display:grid;place-items:center;font-weight:900}.userMini{display:flex;align-items:center;gap:9px}.timeline{display:grid;gap:0}.step{display:grid;grid-template-columns:25px 1fr;gap:12px;min-height:58px}.stepDot{width:12px;height:12px;border-radius:50%;margin:4px 0 0 2px;background:#405166;border:2px solid #0a1421;box-shadow:0 0 0 1px var(--line)}.step.done .stepDot{background:var(--success);box-shadow:0 0 15px rgba(98,230,173,.4)}.step.current .stepDot{background:var(--accent);box-shadow:0 0 15px rgba(142,197,255,.5)}.stepLine{width:1px;height:35px;background:var(--line);margin:0 0 0 7px}.step:last-child .stepLine{display:none}
.footer{max-width:1400px;margin:auto;padding:30px 18px;color:#6f8298;font-size:12px;border-top:1px solid var(--line)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.metricGrid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.sideLayout{grid-template-columns:1fr}.sidebar{display:none}.mobileNav{display:flex;position:fixed;bottom:12px;left:12px;right:12px;z-index:50;justify-content:space-around;padding:8px;border:1px solid var(--line);background:rgba(7,16,28,.85);backdrop-filter:blur(22px);border-radius:18px}.mobileNav button{background:transparent;border:0;color:var(--muted);padding:8px}.mobileNav button.active{color:var(--text)}}
@media(max-width:700px){.topbar{padding:10px 12px}.navlinks{display:none}.menu{display:block;margin-left:auto}.shell{padding:20px 12px 100px}.heroCard{padding:24px}.heroStats{padding:15px}.grid,.grid2,.grid3,.formgrid{grid-template-columns:1fr}.metricGrid{grid-template-columns:1fr 1fr}h1{letter-spacing:-2px}.sectionHead{align-items:start;flex-direction:column}.search{flex-direction:column}.panel{padding:17px}.card{padding:16px}.modalBox{padding:18px}.metric strong{font-size:23px}}
</style></head>
<body><div id="app"><header class="topbar"><div class="nav"><div class="brand"><div class="logo">MB</div><span>MISTRI BHAI</span></div><div class="navlinks"><button data-view="home" onclick="nav('home')">Home</button><button data-view="services" onclick="nav('services')">Services</button><button data-view="bookings" onclick="nav('bookings')">Active</button><button data-view="history" onclick="nav('history')">History</button><button data-view="provider" onclick="nav('provider')">Work with us</button><button data-view="account" onclick="nav('account')">Account</button></div><button class="iconbtn menu" onclick="toast('Use the bottom navigation on mobile')">☰</button></div></header>
<main class="shell"><div id="appContent"></div><script>document.querySelector("#appContent").id="appMain";</script></main></div><div id="modal" class="modal"><div class="modalBox"><div id="modalBody"></div></div></div><div id="toast" class="toast"></div><div class="mobileNav"><button data-view="home" onclick="nav('home')">⌂</button><button data-view="services" onclick="nav('services')">⌕</button><button data-view="bookings" onclick="nav('bookings')">▣</button><button data-view="history" onclick="nav('history')">◷</button><button data-view="account" onclick="nav('account')">◉</button></div><script>
const services=[
{id:1,n:"Plumbing",i:"🔧",from:249,desc:"Leaks, taps, pipes, bathroom & kitchen plumbing",popular:true},
{id:2,n:"Electrician",i:"⚡",from:199,desc:"Switches, fans, wiring, sockets & electrical faults",popular:true},
{id:3,n:"Carpenter",i:"🪚",from:349,desc:"Furniture repair, doors, shelves & custom work",popular:true},
{id:4,n:"AC Repair",i:"❄️",from:399,desc:"AC service, cooling issues, installation & repair",popular:true},
{id:5,n:"Painter",i:"🎨",from:599,desc:"Wall painting, touch-ups & complete room painting"},
{id:6,n:"Cleaning",i:"🧹",from:299,desc:"Home, bathroom, kitchen and deep cleaning"},
{id:7,n:"RO Repair",i:"💧",from:249,desc:"RO service, filter replacement & water purifier repair"},
{id:8,n:"Appliance Repair",i:"📺",from:299,desc:"Washing machine, fridge, microwave & appliance repair"}
];
let bookings=JSON.parse(localStorage.getItem("mb_bookings")||"null")||[
{id:"MB-1042",service:"Plumbing",worker:"Rakesh Kumar",date:"Today",time:"ASAP",address:"Model Town",status:"ARRIVING",amount:449},
{id:"MB-1029",service:"AC Repair",worker:"Amit Verma",date:"25 Sep",time:"4:00 PM",address:"Civil Lines",status:"COMPLETED",amount:699}
];
let state={auth:false,view:"home",selectedService:null,booking:null,providerStatus:"",coupon:"",notifications:2};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem("mb_bookings",JSON.stringify(bookings))}
function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2400)}
function nav(view){state.view=view;render();scrollTo({top:0,behavior:"smooth"})}
function serviceCard(s){return `<div class="card serviceCard" data-search="${s.n.toLowerCase()} ${s.desc.toLowerCase()}"><div class="icon">${s.i}</div><div class="row"><h3>${s.n}</h3><span class="chip">₹${s.from}+</span></div><p class="muted" style="font-size:13px;line-height:1.5">${s.desc}</p><button class="btn small" onclick="openService(${s.id})">View & Book</button></div>`}
function home(){
return `<div class="hero"><div class="heroCard"><span class="eyebrow"><span class="dot"></span> Trusted local professionals</span><h1>Reliable help.<br><span style="color:#9fc8ff">Right when you need it.</span></h1><p>Book verified local professionals for everyday repairs and home services. Transparent starting prices, live job status and a simple booking experience.</p><div class="search"><input id="homeSearch" class="input" placeholder="Search plumbing, electrician, AC repair..." oninput="filterServices(this.value)"><button class="btn primary" onclick="nav('services')">Explore services</button></div><div class="heroActions"><button class="btn" onclick="openBooking('ASAP')">⚡ Book ASAP</button><button class="btn" onclick="openBooking('SCHEDULED')">📅 Schedule a service</button></div></div><div class="heroStats glass"><div class="stat"><strong>4.8★</strong><span>Average customer rating</span></div><div class="stat"><strong>2,500+</strong><span>Verified professionals</span></div><div class="stat"><strong>30 min</strong><span>Typical response time</span></div><div class="stat"><strong>₹199+</strong><span>Starting service price</span></div></div></div>
<div class="section"><div class="sectionHead"><div><h2>Popular services</h2><p>Common jobs, clear starting prices.</p></div><button class="btn small" onclick="nav('services')">View all</button></div><div class="grid">${services.filter(s=>s.popular).map(serviceCard).join("")}</div></div>
<div class="section"><div class="sectionHead"><div><h2>Why Mistri Bhai</h2><p>A service marketplace designed around trust and control.</p></div></div><div class="grid3"><div class="card"><div class="icon">✓</div><h3>Verified professionals</h3><p class="muted">Applications are reviewed before workers can accept jobs.</p></div><div class="card"><div class="icon">₹</div><h3>Price transparency</h3><p class="muted">Workers request approval for extra charges instead of silently changing the bill.</p></div><div class="card"><div class="icon">⌁</div><h3>Live job flow</h3><p class="muted">Track searching, assigned, arriving, started and completed states.</p></div></div></div>
<div class="section"><div class="card" style="padding:26px"><div class="row"><div><span class="eyebrow">Earn with Mistri Bhai</span><h2 style="margin:8px 0">Turn your skills into local work.</h2><p class="muted">Apply as a plumber, electrician, carpenter, painter, cleaner or other service professional.</p></div><button class="btn primary" onclick="nav('provider')">Become a provider</button></div></div></div>`;
}
function servicesView(){
return `<div class="sectionHead"><div><h2>All services</h2><p>Choose a service to see pricing and available professionals.</p></div></div><div class="search"><input id="serviceSearch" class="input" placeholder="Search services..." oninput="filterServices(this.value)"><select class="select" id="sortServices" style="max-width:190px" onchange="sortServices(this.value)"><option value="popular">Popular</option><option value="low">Lowest price</option><option value="name">Name</option></select></div><div id="serviceGrid" class="grid" style="margin-top:15px">${services.map(serviceCard).join("")}</div>`;
}
function bookingView(){
if(!state.booking)return `<div class="card empty">No active booking. <button class="btn primary" onclick="openBooking('ASAP')">Book a service</button></div>`;
let b=state.booking;let order=["CREATED","SEARCHING","ASSIGNED","ACCEPTED","ARRIVING","STARTED","COMPLETED","PAYMENT_PENDING","PAYMENT_SETTLED","RATED"];let idx=order.indexOf(b.status);
return `<div class="grid2"><div class="card"><div class="row"><div><span class="eyebrow">Active booking</span><h2 style="margin:7px 0">${b.service}</h2></div><span class="chip ${b.status==='COMPLETED'?'success':''}">${b.status}</span></div><p class="muted">${b.id} · ${b.worker||"Finding a professional..."}</p><div class="statusLine">📍 ${b.address||"Your selected address"} <span class="muted">·</span> ${b.time||"ASAP"}</div><div class="timeline" style="margin-top:20px">${order.map((x,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'current':''}"><div><div class="stepDot"></div><div class="stepLine"></div></div><div><strong style="font-size:13px">${x.replaceAll("_"," ")}</strong><div class="muted" style="font-size:12px">${i<idx?"Completed":i===idx?"Current status":"Pending"}</div></div></div>`).join("")}</div>${b.status==="ARRIVING"?`<button class="btn primary" style="margin-top:12px" onclick="simulateProgress()">Simulate arrival</button>`:""}${b.status==="COMPLETED"?`<button class="btn primary" style="margin-top:12px" onclick="rateBooking()">Rate service</button>`:""}</div><div class="card"><h3>Booking summary</h3><div class="list"><div class="listItem row"><span>Base service</span><strong>₹${b.amount}</strong></div><div class="listItem row"><span>Platform fee</span><strong>₹20</strong></div><div class="listItem row"><span>Total</span><strong>₹${b.amount+20}</strong></div></div><button class="btn danger" style="margin-top:14px" onclick="cancelBooking()">Cancel booking</button></div></div>`;
}
function historyView(){return `<div class="sectionHead"><div><h2>Booking history</h2><p>Your previous service requests.</p></div></div><div class="list">${bookings.map(b=>`<div class="listItem"><div class="row"><div><strong>${b.service}</strong><div class="muted">${b.id} · ${b.date} · ${b.address}</div></div><span class="chip ${b.status==="COMPLETED"?"success":""}">${b.status}</span></div><div class="row" style="margin-top:10px"><span class="muted">${b.worker||"Professional assignment pending"}</span><strong>₹${b.amount}</strong></div></div>`).join("")}</div>`}
function providerView(){
let status=state.providerStatus||localStorage.getItem("mb_providerStatus")||"";
if(status)return `<div class="grid2"><div class="card"><span class="eyebrow">Provider application</span><h2>Application submitted</h2><p class="muted">Your application is currently being processed by the Mistri Bhai admin team.</p><div class="statusLine"><span class="dot"></span><strong>${status}</strong></div><div class="timeline" style="margin-top:20px">${["SUBMITTED","UNDER REVIEW","APPROVED"].map((x,i)=>`<div class="step ${i< (status==="APPROVED"?3:status==="UNDER REVIEW"?2:1)?'done':''}"><div><div class="stepDot"></div><div class="stepLine"></div></div><div><strong>${x}</strong><div class="muted">${i===0?"Application received":i===1?"Documents and profile are being checked":"You can now create your worker account"}</div></div></div>`).join("")}</div></div><div class="card"><h3>What happens next?</h3><p class="muted">Approved workers can continue in MISTRI BHAI WORK. Until approval, the worker dashboard remains unavailable.</p><button class="btn" onclick="nav('home')">Back home</button></div></div>`;
return `<div class="card panel"><div class="sectionHead"><div><span class="eyebrow">Work with us</span><h2>Become a Service Provider</h2><p>Submit your profile for admin verification. No real documents are uploaded in this demo.</p></div></div><form id="providerForm" onsubmit="submitProvider(event)"><div class="formgrid"><div class="field"><label>Full name *</label><input class="input" name="name" required></div><div class="field"><label>Mobile number *</label><input class="input" name="phone" required></div><div class="field"><label>Location *</label><input class="input" name="location" placeholder="City / locality" required></div><div class="field"><label>Service category *</label><select class="select" name="category" required><option value="">Select</option>${services.map(s=>`<option>${s.n}</option>`).join("")}</select></div><div class="field full"><label>Skills</label><input class="input" name="skills" placeholder="Example: pipe fitting, tap repair, motor pump"></div><div class="field"><label>Experience</label><select class="select" name="experience"><option>0–1 years</option><option>2–5 years</option><option>6–10 years</option><option>10+ years</option></select></div><div class="field"><label>Working radius</label><select class="select" name="radius"><option>3 km</option><option>5 km</option><option>10 km</option><option>20 km</option></select></div><div class="field full"><label>Services offered</label><textarea class="textarea" name="services" placeholder="Describe the jobs you can accept"></textarea></div><div class="field"><label>Availability</label><select class="select" name="availability"><option>Full day</option><option>Morning</option><option>Evening</option><option>Weekends</option></select></div><div class="field"><label>Verification information</label><input class="input" name="verification" placeholder="ID type / verification note"></div><div class="field"><label>Required documents</label><input class="input" type="file" disabled><small class="muted">Demo mode: upload integration ready for backend.</small></div><div class="field"><label>UPI ID (optional)</label><input class="input" name="upi" placeholder="name@upi"></div></div><button class="btn primary" style="margin-top:18px">Submit application</button></form></div>`;
}
function accountView(){return `<div class="grid2"><div class="card"><div class="userMini"><div class="avatar">MB</div><div><strong>Madhav Sharma</strong><div class="muted">madhav@example.com</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="list"><div class="listItem row"><span>Phone</span><span>+91 98XXXXXX21</span></div><div class="listItem row"><span>Saved address</span><span>Model Town</span></div><div class="listItem row"><span>Wallet / credits</span><strong>₹250</strong></div></div></div><div class="card"><h3>Settings & support</h3><div class="list"><button class="sidebtn" onclick="toast('Notifications settings opened')">🔔 Notifications</button><button class="sidebtn" onclick="toast('Privacy settings opened')">🔒 Privacy</button><button class="sidebtn" onclick="toast('Support ticket flow opened')">💬 Help & support</button><button class="sidebtn" onclick="logout()">↪ Logout</button></div></div></div>`}
function render(){
let app=$("#appMain");if(state.view==="home")app.innerHTML=home();else if(state.view==="services")app.innerHTML=servicesView();else if(state.view==="bookings")app.innerHTML=bookingView();else if(state.view==="history")app.innerHTML=historyView();else if(state.view==="provider")app.innerHTML=providerView();else if(state.view==="account")app.innerHTML=accountView();updateNav();
}
function updateNav(){$$(".navlinks button,.mobileNav button").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view))}
function filterServices(q){let term=(q||"").toLowerCase();$$(".serviceCard").forEach(c=>c.style.display=c.dataset.search.includes(term)?"":"none")}
function sortServices(v){let a=[...services];if(v==="low")a.sort((x,y)=>x.from-y.from);if(v==="name")a.sort((x,y)=>x.n.localeCompare(y.n));$("#serviceGrid").innerHTML=a.map(serviceCard).join("")}
function openService(id){let s=services.find(x=>x.id===id);state.selectedService=s;$("#modal").classList.add("show");$("#modalBody").innerHTML=`<div class="modalHead"><div><span class="eyebrow">${s.i} ${s.n}</span><h2>Book ${s.n}</h2></div><button class="iconbtn" onclick="closeModal()">✕</button></div><p class="muted">${s.desc}</p><div class="grid2"><div class="card"><strong>Starting price</strong><div class="price">₹${s.from}</div><span class="muted">Final price can vary by job scope.</span></div><div class="card"><strong>Typical response</strong><div class="price">15–40 min</div><span class="muted">Depends on local availability.</span></div></div><div class="heroActions"><button class="btn primary" onclick="openBooking('ASAP');closeModal()">Book ASAP</button><button class="btn" onclick="openBooking('SCHEDULED');closeModal()">Schedule</button></div>`}
function openBooking(mode){$("#modal").classList.add("show");$("#modalBody").innerHTML=`<div class="modalHead"><h2>${mode==="ASAP"?"Book ASAP":"Schedule service"}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form onsubmit="createBooking(event,'${mode}')"><div class="formgrid"><div class="field full"><label>Service</label><select class="select" id="bookService" required>${services.map(s=>`<option ${state.selectedService&&s.id===state.selectedService.id?"selected":""}>${s.n}</option>`).join("")}</select></div><div class="field"><label>Date</label><input class="input" type="date" name="date" ${mode==="ASAP"?"":"required"}></div><div class="field"><label>Time</label><input class="input" type="time" name="time" ${mode==="ASAP"?"":"required"}></div><div class="field full"><label>Address</label><input class="input" name="address" value="Model Town" required></div><div class="field"><label>Coupon</label><input class="input" name="coupon" placeholder="TRY MB50"></div><div class="field"><label>Payment</label><select class="select"><option>Cash after service</option><option>UPI (mock)</option><option>Card (mock)</option></select></div></div><div class="statusLine" style="margin-top:14px">🛡️ Worker approval is required before the job is assigned.</div><button class="btn primary" style="margin-top:16px">Confirm booking</button></form>`}
function createBooking(e,mode){e.preventDefault();let f=new FormData(e.target),s=f.get("bookService")||$("#bookService").value;let sv=services.find(x=>x.n===s)||services[0];let b={id:"MB-"+Math.floor(1000+Math.random()*8999),service:sv.n,worker:"Searching nearby professionals",date:f.get("date")||"Today",time:mode==="ASAP"?"ASAP":f.get("time"),address:f.get("address"),status:"SEARCHING",amount:sv.from};bookings.unshift(b);state.booking=b;save();closeModal();nav("bookings");toast("Booking created — searching nearby professionals")}
function simulateProgress(){let b=state.booking;if(!b)return;let seq=["SEARCHING","ASSIGNED","ACCEPTED","ARRIVING","STARTED","COMPLETED","PAYMENT_PENDING","PAYMENT_SETTLED","RATED"];let n=seq.indexOf(b.status);b.status=seq[Math.min(n+1,seq.length-1)];b.worker="Rakesh Kumar";save();render();toast("Booking updated: "+b.status)}
function cancelBooking(){if(!state.booking)return;state.booking.status="CANCELLED";save();render();toast("Booking cancelled")}
function rateBooking(){let rating=prompt("Rate your service from 1 to 5");if(rating){state.booking.status="RATED";save();render();toast("Thanks — rating saved in mock state")}}
function submitProvider(e){e.preventDefault();state.providerStatus="UNDER REVIEW";localStorage.setItem("mb_providerStatus","UNDER REVIEW");toast("Application submitted");render()}
function logout(){state.auth=false;toast("Logged out (frontend demo state)");openAuth()}
function closeModal(){$("#modal").classList.remove("show")}
function openAuth(){let m=$("#modal");m.classList.add("show");$("#modalBody").innerHTML=`<div class="modalHead"><h2>Sign in to Mistri Bhai</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form onsubmit="authSubmit(event)"><div class="field"><label>Mobile or email</label><input class="input" required placeholder="+91 / email"></div><div class="field" style="margin-top:10px"><label>Password</label><input class="input" type="password" required value="demo123"></div><div class="row" style="margin-top:9px"><button type="button" class="linkbtn" onclick="forgot()">Forgot password?</button><button type="button" class="linkbtn" onclick="signup()">Create account</button></div><button class="btn primary" style="width:100%;margin-top:10px">Continue</button></form>`}
function authSubmit(e){e.preventDefault();state.auth=true;closeModal();toast("Signed in — mock account active")}
function forgot(){let b=$("#modalBody");b.innerHTML=`<div class="modalHead"><h2>Reset password</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p class="muted">Enter your registered mobile/email. A real OTP provider can be connected later.</p><input class="input" placeholder="Mobile or email"><button class="btn primary" style="margin-top:12px;width:100%" onclick="toast('Demo OTP sent');closeModal()">Send OTP</button>`}
function signup(){let b=$("#modalBody");b.innerHTML=`<div class="modalHead"><h2>Create account</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form onsubmit="e=>e.preventDefault()"><div class="formgrid"><div class="field"><label>Name</label><input class="input" required></div><div class="field"><label>Mobile</label><input class="input" required></div><div class="field full"><label>Email</label><input class="input" type="email"></div><div class="field full"><label>Password</label><input class="input" type="password" required></div></div><button type="button" class="btn primary" style="margin-top:15px;width:100%" onclick="state.auth=true;closeModal();toast('Account created in mock state')">Create account</button></form>`}
document.addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
</script></body></html>
